<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>图书列表 - 图书借阅系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h2>图书借阅系统</h2>

  <div class="toolbar">
    <button id="add" class="btn">新增</button>
    <div class="search">
      图书名称：<input id="bookName" type="text" placeholder="请输入图书名称">
      <button id="search" class="btn">查询</button>
    </div>
  </div>

  <div id="summary" class="summary"></div>

  <table>
    <thead>
    <tr>
      <th>图书编号</th>
      <th>图书分类</th>
      <th>图书名称</th>
      <th>作者</th>
      <th>出版社</th>
      <th>入库时间</th>
      <th>是否借阅</th>
      <th>操作</th>
    </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div id="pager" class="pager"></div>
</div>

<script src="lib/jquery-1.8.3.min.js"></script>
<script>window.jQuery || document.write('<script src="https://code.jquery.com/jquery-1.8.3.min.js"><\/script>');</script>
<script src="js/common.js"></script>
<script src="js/list.js"></script>
</body>
</html>
